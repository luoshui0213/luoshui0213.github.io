<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VOCALOID 钢琴 · 88 键</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0a0c11;
  --panel:#141922;
  --panel-hi:#1a202b;
  --line:#232a36;
  --line-hi:#2f3849;
  --text:#e8edf6;
  --muted:#8a95a8;
  --muted-2:#5d6779;
  --accent:#4dd6c1;
  --accent-2:#6ea8ff;
  --danger:#ff7b7b;
}
html,body{height:100%}
body{
  margin:0;
  height:100vh;
  height:100dvh;
  padding:12px;
  overflow:hidden;
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(900px 460px at 10% -10%, rgba(77,214,193,.11), transparent 62%),
    radial-gradient(760px 420px at 94% 2%, rgba(110,168,255,.11), transparent 64%),
    linear-gradient(180deg,#0b0e14,#080a0f 58%,#06080c);
  color-scheme:dark;
}
.app{
  height:100%;
  max-width:1560px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
}
.panel{
  flex:0 0 auto;
  margin-top:auto;
  padding:12px 14px 13px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  box-shadow:0 18px 40px -28px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.045);
}
.panel-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px rgba(77,214,193,.45), 0 0 22px rgba(77,214,193,.28);
}
.panel-head h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em}
.badge{
  font-size:10.5px;color:var(--muted);
  padding:2px 7px;border:1px solid var(--line);border-radius:99px;
  letter-spacing:.02em;
}
.now{
  margin-left:auto;
  min-width:76px;
  padding:3px 10px;
  text-align:center;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  color:var(--muted-2);
  border:1px solid transparent;
  border-radius:8px;
  transition:color .2s,border-color .2s,background .2s;
}
.now.on{
  color:var(--accent);
  border-color:rgba(77,214,193,.35);
  background:rgba(77,214,193,.07);
}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:12px}
.slider-row{display:flex;gap:18px;flex-wrap:wrap;flex:1 1 320px;max-width:720px;margin:0}
.slider-item{flex:1 1 130px;min-width:110px}
.slider-item{flex:1 1 130px;min-width:120px}
.slider-item .lab{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:6px;font-size:11px;color:var(--muted);letter-spacing:.04em;
}
.slider-item .lab b{font-size:11.5px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:20px;margin:0;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:99px;
  background:linear-gradient(90deg,var(--accent) var(--p,50%),#262e3b var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;margin-top:-5px;
  border:2px solid var(--accent);border-radius:50%;
  background:#0f131b;
  box-shadow:0 0 0 3px rgba(77,214,193,.12);
  transition:box-shadow .15s;
}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(77,214,193,.17)}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:#262e3b}
input[type=range]::-moz-range-progress{height:4px;border-radius:99px;background:var(--accent)}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border:2px solid var(--accent);border-radius:50%;background:#0f131b;
}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0}
.btn{
  appearance:none;font:inherit;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;
  color:var(--text);
  background:linear-gradient(180deg,#202734,#1a202b);
  border:1px solid var(--line-hi);border-radius:10px;
  cursor:pointer;
  transition:background .16s,border-color .16s,color .16s,transform .1s,opacity .16s;
}
.btn:hover{background:#242c3a;border-color:#3a4557}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.btn.on{
  color:var(--accent);
  background:rgba(77,214,193,.14);
  border-color:rgba(77,214,193,.55);
}
.btn.rec{color:#ffb0b0;border-color:rgba(255,123,123,.4)}
.btn.rec:hover{background:rgba(255,123,123,.12);border-color:rgba(255,123,123,.6)}
.btn.blue{color:#9cc7ff;border-color:rgba(110,168,255,.4)}
.btn.blue:hover{background:rgba(110,168,255,.12);border-color:rgba(110,168,255,.6)}
.oct-box{
  display:flex;align-items:center;gap:2px;
  margin-left:auto;padding:2px;
  background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:10px;
}
.oct-btn{
  width:30px;height:30px;
  border:0;border-radius:8px;
  background:transparent;color:var(--text);
  font-size:17px;line-height:1;cursor:pointer;
  transition:background .15s,opacity .15s;
}
.oct-btn:hover:not(:disabled){background:rgba(255,255,255,.07)}
.oct-btn:disabled{opacity:.3;cursor:not-allowed}
.oct-text{
  min-width:78px;text-align:center;
  font-size:11.5px;font-weight:600;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.record-row{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line);
}
.record-status{
  font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.record-status.live{color:var(--danger)}
.stage{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.scroll-tip{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;color:#7c8799;letter-spacing:.03em;
}
.scroll-tip .line{height:1px;width:28px;background:linear-gradient(90deg,transparent,#2c3543)}
.scroll-tip .line.r{background:linear-gradient(270deg,transparent,#2c3543)}
.piano-wrap{
  position:relative;
  padding-bottom:6px;
  overflow-x:auto;overflow-y:hidden;
  border:1px solid #1c232e;border-radius:14px;
  background:#0b0e14;
  box-shadow:inset 0 2px 12px -6px rgba(0,0,0,.95);
  overscroll-behavior-x:contain;
  touch-action:pan-x;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#2a3240 transparent;
}
.piano-wrap::-webkit-scrollbar{height:8px}
.piano-wrap::-webkit-scrollbar-track{background:transparent}
.piano-wrap::-webkit-scrollbar-thumb{background:#2a3240;border-radius:99px}
.piano{
  --key-h:184px;
  --key-w:clamp(38px,calc(var(--key-h) * .275),96px);
  position:relative;
  display:flex;
  width:fit-content;
  height:var(--key-h);
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:pan-x;
}
.white{
  position:relative;flex:0 0 auto;
  width:var(--key-w);height:100%;
  border:1px solid #c9cedb;border-top:0;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,#ffffff 0%,#f6f8fc 52%,#e7ebf3 84%,#d9dee8 100%);
  box-shadow:inset 0 -7px 9px -6px rgba(20,32,56,.34), inset 0 1px 0 #fff;
  cursor:pointer;
  transition:background .07s,box-shadow .07s,transform .07s;
}
.white:hover{background:linear-gradient(180deg,#fff,#fbfcff 60%,#eef2f8)}
.white.active{
  background:linear-gradient(180deg,#fff7dc 0%,#ffe08a 55%,#f4b52a 100%);
  box-shadow:inset 0 -6px 10px -4px rgba(140,92,0,.5), inset 0 1px 0 rgba(255,255,255,.9);
  transform:translateY(2px);
}
.black{
  position:absolute;top:0;z-index:2;
  width:calc(var(--key-w) * .59);
  height:63%;
  left:calc(var(--wi) * var(--key-w) - var(--key-w) * .295);
  border-radius:0 0 5px 5px;
  background:linear-gradient(180deg,#343a45 0%,#1d222b 46%,#0c0f14 100%);
  box-shadow:0 8px 12px -6px rgba(0,0,0,.9), inset 0 -3px 4px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.12);
  cursor:pointer;
  transition:background .07s,box-shadow .07s,transform .07s;
}
.black:hover{background:linear-gradient(180deg,#3c4450,#222833 46%,#10141a)}
.black.active{
  background:linear-gradient(180deg,#e6b64a 0%,#b0831c 55%,#77530a 100%);
  box-shadow:0 3px 6px -3px rgba(0,0,0,.85), inset 0 -2px 3px rgba(255,255,255,.18);
  transform:translateY(1px);
}
.key-label{
  position:absolute;left:0;right:0;bottom:7px;
  text-align:center;line-height:1;letter-spacing:.02em;
  font-size:clamp(9px,calc(var(--key-w) * .17),12px);
  color:#6f7889;font-variant-numeric:tabular-nums;
  pointer-events:none;transition:opacity .15s;
}
.black .key-label{
  bottom:5px;
  font-size:clamp(7px,calc(var(--key-w) * .115),9.5px);
  color:#8b95a8;
}
.white.active .key-label{color:#54370a;font-weight:600}
.black.active .key-label{color:#ffe6a0}
.label-hide .key-label{opacity:0}
.key-hint{
  flex:0 0 auto;
  margin-bottom:auto;
  display:flex;flex-direction:column;gap:7px;
  padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;
  background:rgba(20,25,34,.72);
  font-size:11px;line-height:1.75;color:var(--muted);
}
.hint-row{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
kbd{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:17px;height:17px;padding:0 4px;
  border:1px solid #333c4b;border-bottom-width:2px;border-radius:4px;
  background:#1e2430;color:#c6cedd;
  font:10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (min-width:1600px){
  .app{max-width:1800px}
  .panel{padding:15px 19px 16px;border-radius:20px}
  .panel-head h1{font-size:17px}
  .badge{font-size:11.5px}
  .now{font-size:13px;min-width:86px}
  .slider-item .lab{font-size:12px}
  .btn{padding:9px 16px;font-size:13px;border-radius:11px}
  .oct-btn{width:34px;height:34px;font-size:19px}
  .oct-text{font-size:13px;min-width:88px}
  .record-status{font-size:12.5px}
  .scroll-tip{font-size:12px}
  .key-hint{font-size:12.5px;padding:13px 16px}
  kbd{height:19px;min-width:19px;font-size:11.5px}
}
@media (min-width:2200px){
  .app{max-width:2000px}
}
@media (max-width:720px){
  body{padding:8px}
  .panel{padding:10px 12px 11px;border-radius:14px}
  .panel-head h1{font-size:14px}
  .badge{display:none}
  .now{min-width:56px;padding:2px 8px;font-size:11px}
  .oct-box{margin-left:0}
  .btn{padding:7px 11px}
  .key-hint{font-size:10.5px;padding:9px 10px}
}
@media (max-height:640px){
  .key-hint{display:none}
  .scroll-tip{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-head">
      <span class="dot"></span>
      <h1>VOCALOID 钢琴</h1>
      <span class="badge">88 键 · A0–C8</span>
      <span class="now" id="noteDisplay">—</span>
    </div>

    <div class="controls">
      <div class="slider-row">
        <div class="slider-item">
          <div class="lab"><span>音量</span><b id="volVal">78%</b></div>
          <input type="range" id="vol" min="0" max="100" step="1" value="78" aria-label="音量">
        </div>
        <div class="slider-item">
          <div class="lab"><span>混响</span><b id="revVal">42%</b></div>
          <input type="range" id="rev" min="0" max="100" step="1" value="42" aria-label="混响">
        </div>
      </div>

      <div class="toolbar">
        <button class="btn" id="toggleLabelBtn" type="button">隐藏音名</button>
        <button class="btn" id="gotoMiddleC" type="button">定位中央 C</button>
        <div class="oct-box">
          <button class="oct-btn" id="octDown" type="button" aria-label="降低八度">−</button>
          <span class="oct-text" id="octLabel">C4 – B5</span>
          <button class="oct-btn" id="octUp" type="button" aria-label="升高八度">+</button>
        </div>
      </div>
    </div>

    <div class="record-row">
      <button class="btn rec" id="recStart" type="button">● 开始录音</button>
      <button class="btn" id="recStop" type="button" disabled>■ 停止</button>
      <button class="btn" id="playRec" type="button" disabled>▶ 回放</button>
      <button class="btn" id="clearRec" type="button" disabled>清空</button>
      <button class="btn blue" id="exportRec" type="button" disabled>导出 JSON</button>
      <span class="record-status" id="recStatus">就绪，等待录制</span>
    </div>
  </div>

  <div class="stage">
    <div class="scroll-tip">
      <span class="line"></span>
      滑动或滚轮查看完整 88 键
      <span class="line r"></span>
    </div>
    <div class="piano-wrap" id="pianoWrap">
      <div class="piano" id="piano"></div>
    </div>
  </div>

  <div class="key-hint">
    <div class="hint-row">
      <kbd>Z</kbd><kbd>S</kbd><kbd>X</kbd><kbd>D</kbd><kbd>C</kbd><kbd>V</kbd><kbd>G</kbd><kbd>B</kbd><kbd>H</kbd><kbd>N</kbd><kbd>J</kbd><kbd>M</kbd>
      低八度
      <span style="width:12px"></span>
      <kbd>Q</kbd><kbd>2</kbd><kbd>W</kbd><kbd>3</kbd><kbd>E</kbd><kbd>R</kbd><kbd>5</kbd><kbd>T</kbd><kbd>6</kbd><kbd>Y</kbd><kbd>7</kbd><kbd>U</kbd>
      高八度
    </div>
    <div class="hint-row">
      <kbd>[</kbd><kbd>]</kbd> 切换八度 ·
      <kbd>Esc</kbd> 停止回放 ·
      鼠标 / 触屏可直接弹奏，按住横向滑动即滑奏 · 滚轮可左右滚动键盘
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ========== 常量 ========== */
  var LOW_MIDI = 21;          // A0
  var HIGH_MIDI = 108;        // C8
  var MIDDLE_C_MIDI = 60;     // C4
  var NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var BLACK_PC = {1:1,3:1,6:1,8:1,10:1};
  var RELEASE_TIME = 0.42;

  var mtof  = function(m){ return 440 * Math.pow(2, (m - 69) / 12); };
  var mname = function(m){ return NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); };
  var isBlack = function(m){ return !!BLACK_PC[((m % 12) + 12) % 12]; };

  /* ========== DOM ========== */
  var pianoEl     = document.getElementById('piano');
  var pianoWrap   = document.getElementById('pianoWrap');
  var appEl       = document.querySelector('.app');
  var panelEl     = document.querySelector('.panel');
  var stageEl     = document.querySelector('.stage');
  var tipEl       = document.querySelector('.scroll-tip');
  var hintEl      = document.querySelector('.key-hint');
  var noteDisplay = document.getElementById('noteDisplay');
  var octLabel    = document.getElementById('octLabel');
  var octDown     = document.getElementById('octDown');
  var octUp       = document.getElementById('octUp');
  var volEl       = document.getElementById('vol');
  var revEl       = document.getElementById('rev');
  var volVal      = document.getElementById('volVal');
  var revVal      = document.getElementById('revVal');
  var toggleLabelBtn = document.getElementById('toggleLabelBtn');
  var gotoMiddleCBtn = document.getElementById('gotoMiddleC');
  var recStartBtn = document.getElementById('recStart');
  var recStopBtn  = document.getElementById('recStop');
  var playBtn     = document.getElementById('playRec');
  var clearBtn    = document.getElementById('clearRec');
  var exportBtn   = document.getElementById('exportRec');
  var recStatus   = document.getElementById('recStatus');

  /* ========== 音频引擎 ========== */
  var A = {
    ctx:null, master:null, dry:null, wet:null, conv:null,
    state:{ vol:78, rev:42 }
  };

  function makeIR(ctx, seconds, decay){
    var rate = ctx.sampleRate;
    var len  = Math.floor(rate * seconds);
    var buf  = ctx.createBuffer(2, len, rate);
    var fadeIn = rate * 0.012;
    for(var c = 0; c < 2; c++){
      var data = buf.getChannelData(c);
      for(var i = 0; i < len; i++){
        var t   = i / len;
        var atk = Math.min(1, i / fadeIn);
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * atk;
      }
    }
    return buf;
  }

  function applyMix(){
    if(!A.ctx || !A.master) return;
    var now = A.ctx.currentTime;
    A.master.gain.setTargetAtTime(A.state.vol / 100, now, 0.02);
    A.wet.gain.setTargetAtTime(A.state.rev / 100, now, 0.02);
  }

  function ensureAudio(){
    if(A.ctx){
      if(A.ctx.state !== 'running' && A.ctx.resume) A.ctx.resume();
      return A.ctx;
    }
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    var ctx = new Ctor();

    var master = ctx.createGain();
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -15;
    comp.knee.value = 22;
    comp.ratio.value = 3.5;
    comp.attack.value = 0.004;
    comp.release.value = 0.24;

    var conv = ctx.createConvolver();
    conv.buffer = makeIR(ctx, 2.4, 3.0);

    var dry = ctx.createGain();
    var wet = ctx.createGain();

    dry.connect(comp);
    wet.connect(conv);
    conv.connect(comp);
    comp.connect(master);
    master.connect(ctx.destination);

    A.ctx = ctx; A.master = master; A.dry = dry; A.wet = wet; A.conv = conv;
    applyMix();
    return ctx;
  }

  /* 泛音结构：模拟钢琴的非整数倍音（轻微拉伸） */
  var PARTIALS = [
    [1, 1.000, 1.00],
    [2, 0.360, 0.66],
    [3, 0.175, 0.48],
    [4, 0.090, 0.36],
    [5, 0.046, 0.28],
    [6, 0.026, 0.22],
    [8, 0.011, 0.15]
  ];
  var STRETCH = 0.0006;

  function noteOn(freq, velocity){
    var ctx = ensureAudio();
    if(!ctx) return null;
    var t = ctx.currentTime;

    var out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(velocity, t + 0.01);
    out.connect(A.dry);
    out.connect(A.wet);

    var baseDecay = 5.2 / (1 + Math.pow(freq / 150, 0.6));
    var nyq = ctx.sampleRate * 0.5;
    var oscs = [];

    for(var i = 0; i < PARTIALS.length; i++){
      var ratio = PARTIALS[i][0], amp = PARTIALS[i][1], dscale = PARTIALS[i][2];
      var f = freq * ratio * (1 + STRETCH * ratio * ratio);
      if(f >= nyq * 0.92) continue;

      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      osc.detune.setValueAtTime((Math.random() - 0.5) * 3.5, t);

      var g = ctx.createGain();
      var d = Math.max(0.22, baseDecay * dscale);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);

      osc.connect(g);
      g.connect(out);
      osc.start(t);
      osc.stop(t + d + 0.06);
      oscs.push(osc);
    }

    var released = false;
    return {
      release: function(dur){
        if(released) return;
        released = true;
        var now = ctx.currentTime;
        var g = out.gain;
        var v = 0.0001;
        try { v = Math.max(g.value, 0.0001); } catch(e){}
        g.cancelScheduledValues(now);
        g.setValueAtTime(v, now);
        g.exponentialRampToValueAtTime(0.0001, now + (dur || RELEASE_TIME));
        var stopAt = now + (dur || RELEASE_TIME) + 0.04;
        for(var k = 0; k < oscs.length; k++){
          try { oscs[k].stop(stopAt); } catch(e){}
        }
      }
    };
  }

  /* ========== 构建 88 键 ========== */
  var keyEls = {};
  (function buildKeyboard(){
    var frag = document.createDocumentFragment();
    var whiteIndex = 0;   // 已排布的白键数量，黑键以此定位
    for(var m = LOW_MIDI; m <= HIGH_MIDI; m++){
      var el = document.createElement('div');
      el.dataset.midi = m;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', mname(m));

      var black = isBlack(m);
      el.className = black ? 'black' : 'white';
      if(black){
        /* 黑键中心落在前一个白键的右边线上 */
        el.style.setProperty('--wi', String(whiteIndex));
      }else{
        whiteIndex++;
      }

      var label = document.createElement('span');
      label.className = 'key-label';
      label.textContent = mname(m);
      el.appendChild(label);

      frag.appendChild(el);
      keyEls[m] = el;
    }
    pianoEl.appendChild(frag);
  })();

  /* ========== 演奏状态 ========== */
  var held = {};            // 当前发声的 midi
  var voices = {};          // midi -> voice
  var pointerNotes = {};    // pointerId -> midi
  var kbNotes = {};         // 键位 -> midi

  function setActive(midi, on){
    var el = keyEls[midi];
    if(el) el.classList.toggle('active', !!on);
  }

  function updateNoteDisplay(){
    var keys = Object.keys(held);
    if(!keys.length){
      noteDisplay.textContent = '—';
      noteDisplay.classList.remove('on');
      return;
    }
    keys.sort(function(a, b){ return a - b; });
    var show = keys.slice(-5).map(function(m){ return mname(+m); });
    noteDisplay.textContent = show.join(' · ');
    noteDisplay.classList.add('on');
  }

  function pushRecEvent(type, midi, at){
    if(!isRecording) return;
    var t = (at !== undefined) ? at : (performance.now() - recordStartTime);
    recordEvents.push({ t: Math.round(t * 10) / 10, type: type, midi: midi });
  }

  function startNote(midi){
    if(!(midi >= LOW_MIDI && midi <= HIGH_MIDI)) return false;
    if(held[midi]) return false;

    ensureAudio();
    held[midi] = 1;
    var voice = noteOn(mtof(midi), 0.55);
    if(voice) voices[midi] = voice;

    setActive(midi, true);
    updateNoteDisplay();
    pushRecEvent('on', midi);
    return true;
  }

  function stopNote(midi){
    if(!held[midi]) return;
    delete held[midi];

    var voice = voices[midi];
    if(voice){
      voice.release();
      delete voices[midi];
    }
    setActive(midi, false);
    updateNoteDisplay();
    pushRecEvent('off', midi);
  }

  function stopAllNotes(){
    Object.keys(held).forEach(function(m){ stopNote(+m); });
    pointerNotes = {};
    kbNotes = {};
    updateNoteDisplay();
  }

  /* ========== 鼠标 / 触屏 ========== */
  function midiFromPoint(x, y){
    var el = document.elementFromPoint(x, y);
    if(!el) return null;
    var key = el.closest ? el.closest('.white,.black') : null;
    if(!key || !pianoEl.contains(key)) return null;
    return Number(key.dataset.midi);
  }

  pianoEl.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    var midi = midiFromPoint(e.clientX, e.clientY);
    if(midi === null) return;

    if(e.pointerType === 'mouse'){
      /* 仅鼠标阻止默认行为；触屏交给浏览器处理横向滚动 */
      e.preventDefault();
      try { pianoEl.setPointerCapture(e.pointerId); } catch(err){}
    }
    pointerNotes[e.pointerId] = midi;
    startNote(midi);
  });

  pianoEl.addEventListener('pointermove', function(e){
    if(!(e.pointerId in pointerNotes)) return;
    var prev = pointerNotes[e.pointerId];
    var midi = midiFromPoint(e.clientX, e.clientY);
    if(midi === prev) return;

    pointerNotes[e.pointerId] = midi;
    if(prev !== null) stopNote(prev);
    if(midi !== null) startNote(midi);
  });

  function endPointer(e){
    if(!(e.pointerId in pointerNotes)) return;
    var midi = pointerNotes[e.pointerId];
    delete pointerNotes[e.pointerId];
    if(midi !== null) stopNote(midi);
    if(pianoEl.hasPointerCapture && pianoEl.hasPointerCapture(e.pointerId)){
      try { pianoEl.releasePointerCapture(e.pointerId); } catch(err){}
    }
  }
  pianoEl.addEventListener('pointerup', endPointer);
  pianoEl.addEventListener('pointercancel', endPointer);
  window.addEventListener('pointerup', endPointer, { passive:true });
  pianoEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  /* 桌面端：鼠标滚轮纵向滚动 → 键盘横向滚动 */
  pianoWrap.addEventListener('wheel', function(e){
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   /* 触控板横向手势交给浏览器 */
    var max = pianoWrap.scrollWidth - pianoWrap.clientWidth;
    if(max <= 0) return;
    e.preventDefault();
    pianoWrap.scrollLeft += e.deltaY;
  }, { passive:false });

  /* ========== 电脑键盘 ========== */
  var KEYMAP = {
    z:0, s:1, x:2, d:3, c:4, v:5, g:6, b:7, h:8, n:9, j:10, m:11,
    q:12, '2':13, w:14, '3':15, e:16, r:17, '5':18, t:19, '6':20, y:21, '7':22, u:23
  };
  var OCT_MIN = -3, OCT_MAX = 2;
  var oct = 0;

  function setOctave(v){
    oct = Math.max(OCT_MIN, Math.min(OCT_MAX, v));
    var lo = MIDDLE_C_MIDI + oct * 12;
    octLabel.textContent = mname(lo) + ' – ' + mname(lo + 23);
    octDown.disabled = oct <= OCT_MIN;
    octUp.disabled = oct >= OCT_MAX;
  }

  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    var k = e.key.toLowerCase();

    if(k === 'escape'){
      if(isPlaying){ e.preventDefault(); stopPlayback(); setStatus('回放已停止'); }
      return;
    }
    if(k === '[' || k === '{' || k === ']' || k === '}'){
      e.preventDefault();
      if(!e.repeat) setOctave(oct + ((k === ']' || k === '}') ? 1 : -1));
      return;
    }
    if(e.repeat) return;
    if(!Object.prototype.hasOwnProperty.call(KEYMAP, k)) return;

    e.preventDefault();
    var midi = MIDDLE_C_MIDI + oct * 12 + KEYMAP[k];
    if(midi < LOW_MIDI || midi > HIGH_MIDI) return;
    kbNotes[k] = midi;
    startNote(midi);
  });

  document.addEventListener('keyup', function(e){
    var k = e.key.toLowerCase();
    if(!Object.prototype.hasOwnProperty.call(kbNotes, k)) return;
    var midi = kbNotes[k];
    delete kbNotes[k];
    stopNote(midi);
  });

  /* 失焦时释放所有发声，避免“挂音” */
  window.addEventListener('blur', stopAllNotes);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) stopAllNotes();
  });

  /* ========== 录音 / 回放 ========== */
  var isRecording = false;
  var recordStartTime = 0;
  var recordEvents = [];
  var lastDuration = 0;
  var recTimer = null;

  var isPlaying = false;
  var playbackTimers = [];
  var playbackHeld = {};   // 回放中由回放触发的音

  function fmtTime(ms){
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function setStatus(text, live){
    recStatus.textContent = text;
    recStatus.classList.toggle('live', !!live);
  }

  function syncButtons(){
    recStartBtn.disabled = isRecording;
    recStopBtn.disabled  = !isRecording;
    playBtn.disabled     = recordEvents.length === 0 || isRecording;
    playBtn.classList.toggle('on', isPlaying);
    exportBtn.disabled   = recordEvents.length === 0 || isRecording;
    clearBtn.disabled    = recordEvents.length === 0 && !isRecording;
  }

  function refreshRecLabel(){
    if(!isRecording) return;
    var ms = performance.now() - recordStartTime;
    setStatus('● 录制中 ' + fmtTime(ms) + ' · ' + recordEvents.length + ' 个事件', true);
  }

  recStartBtn.addEventListener('click', function(){
    if(isRecording) return;
    stopPlayback();

    recordEvents = [];
    lastDuration = 0;
    isRecording = true;
    recordStartTime = performance.now();

    /* 若开录时已有按键，补记起始 on，避免回放缺音 */
    Object.keys(held).forEach(function(m){
      recordEvents.push({ t: 0, type: 'on', midi: +m });
    });

    setStatus('● 录制中 0:00 · ' + recordEvents.length + ' 个事件', true);
    if(recTimer) clearInterval(recTimer);
    recTimer = setInterval(refreshRecLabel, 300);
    syncButtons();
  });

  recStopBtn.addEventListener('click', function(){
    if(!isRecording) return;

    /* 关键修复：停止时把仍按下的音补上 off，回放才不会永久挂音 */
    var ms = performance.now() - recordStartTime;
    Object.keys(held).forEach(function(m){
      recordEvents.push({ t: Math.round(ms * 10) / 10, type: 'off', midi: +m });
    });

    isRecording = false;
    lastDuration = ms;
    if(recTimer){ clearInterval(recTimer); recTimer = null; }
    setStatus('已停止 · ' + recordEvents.length + ' 个事件 · 时长 ' + fmtTime(ms));
    syncButtons();
  });

  function stopPlayback(){
    playbackTimers.forEach(function(id){ clearTimeout(id); });
    playbackTimers = [];
    Object.keys(playbackHeld).forEach(function(m){
      stopNote(+m);
      delete playbackHeld[m];
    });
    isPlaying = false;
    playBtn.classList.remove('on');
  }

  playBtn.addEventListener('click', function(){
    if(isPlaying){
      stopPlayback();
      setStatus('回放已停止');
      syncButtons();
      return;
    }
    if(!recordEvents.length){
      setStatus('⚠ 没有录音数据，请先录制');
      return;
    }

    stopAllNotes();
    isPlaying = true;
    playBtn.classList.add('on');
    setStatus('▶ 正在回放 · ' + recordEvents.length + ' 个事件');

    recordEvents.forEach(function(ev){
      var id = setTimeout(function(){
        if(ev.type === 'on'){
          if(startNote(ev.midi)) playbackHeld[ev.midi] = 1;
        }else if(playbackHeld[ev.midi]){
          stopNote(ev.midi);
          delete playbackHeld[ev.midi];
        }
      }, ev.t);
      playbackTimers.push(id);
    });

    var endAt = recordEvents[recordEvents.length - 1].t + 700;
    playbackTimers.push(setTimeout(function(){
      stopPlayback();
      setStatus('回放结束，就绪');
      syncButtons();
    }, endAt));

    syncButtons();
  });

  clearBtn.addEventListener('click', function(){
    if(isRecording){
      isRecording = false;
      if(recTimer){ clearInterval(recTimer); recTimer = null; }
    }
    stopPlayback();
    stopAllNotes();
    recordEvents = [];
    lastDuration = 0;
    setStatus('就绪，等待录制');
    syncButtons();
  });

  exportBtn.addEventListener('click', function(){
    if(!recordEvents.length){
      setStatus('⚠ 没有录音可以导出');
      return;
    }
    var payload = {
      format: 'vocaloid-piano-recording',
      version: 2,
      createdAt: new Date().toISOString(),
      duration: Math.round((lastDuration || recordEvents[recordEvents.length - 1].t) * 10) / 10,
      events: recordEvents
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'piano_record_' + new Date().getTime() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    setStatus('✅ 录音文件已下载');
  });

  /* ========== 键盘自适应高度 ========== */
  function fitKeyboard(){
    if(!appEl || !panelEl || !stageEl) return;
    var appGap = parseFloat(getComputedStyle(appEl).rowGap) || 10;
    var stageGap = parseFloat(getComputedStyle(stageEl).rowGap) || 6;
    var hintShown = !!(hintEl && getComputedStyle(hintEl).display !== 'none');
    var tipShown  = !!(tipEl && getComputedStyle(tipEl).display !== 'none');
    var hintH = hintShown ? hintEl.offsetHeight : 0;
    var tipH  = tipShown ? tipEl.offsetHeight : 0;
    var fixed = panelEl.offsetHeight + hintH + tipH + stageGap
              + appGap * (hintShown ? 3 : 2) + 2;
    var avail = appEl.clientHeight - fixed;
    var W = pianoWrap.clientWidth || appEl.clientWidth;

    /* 按屏宽决定一屏可见的白键数量：手机 6、平板 11、小桌面 14、大桌面 17+ */
    var target = W < 620 ? 6 : (W < 1000 ? 11 : (W < 1360 ? 14 : (W < 1700 ? 17 : 19)));
    var kwMax = W >= 1900 ? 104 : (W >= 1360 ? 96 : 80);
    var kw = Math.max(46, Math.min(kwMax, W / target));   /* 白键宽度 */
    var kh = kw / 0.275;                               /* 标准琴键比例 0.275 */

    /* 纵向空间不足时压缩高度，并同步收窄宽度，保持比例 */
    var h = Math.min(kh, 380, Math.max(120, avail));
    if(h < kh - 0.5) kw = Math.max(42, h * 0.275);

    kw = Math.round(kw);              /* 整数宽度，保证黑键精确压在白键分界线上 */
    pianoEl.style.setProperty('--key-h', Math.round(h) + 'px');
    pianoEl.style.setProperty('--key-w', kw + 'px');
  }

  var settleScroll = function(){
    var max = pianoWrap.scrollWidth - pianoWrap.clientWidth;
    if(max <= 0) return;
    var ratio = pianoWrap.scrollLeft / max;
    requestAnimationFrame(function(){
      var m2 = pianoWrap.scrollWidth - pianoWrap.clientWidth;
      if(m2 > 0) pianoWrap.scrollLeft = ratio * m2;
    });
  };

  var fitTimer = null;
  window.addEventListener('resize', function(){
    if(fitTimer) cancelAnimationFrame(fitTimer);
    fitTimer = requestAnimationFrame(function(){
      fitKeyboard();
      settleScroll();
    });
  });

  /* ========== 面板交互 ========== */
  var labelVisible = true;
  toggleLabelBtn.addEventListener('click', function(){
    labelVisible = !labelVisible;
    pianoEl.classList.toggle('label-hide', !labelVisible);
    toggleLabelBtn.textContent = labelVisible ? '隐藏音名' : '显示音名';
    toggleLabelBtn.classList.toggle('on', !labelVisible);
  });

  function scrollToMiddleC(){
    var el = keyEls[MIDDLE_C_MIDI];
    if(!el) return;
    var target = el.offsetLeft - pianoWrap.clientWidth / 2 + el.offsetWidth / 2;
    var left = Math.max(0, Math.min(target, pianoWrap.scrollWidth - pianoWrap.clientWidth));
    if(pianoWrap.scrollTo) pianoWrap.scrollTo({ left: left, behavior: 'smooth' });
    else pianoWrap.scrollLeft = left;
  }
  gotoMiddleCBtn.addEventListener('click', scrollToMiddleC);

  function paintRange(el){
    var min = Number(el.min || 0), max = Number(el.max || 100);
    var p = ((Number(el.value) - min) / (max - min)) * 100;
    el.style.setProperty('--p', p + '%');
  }

  function syncMixUI(){
    volVal.textContent = A.state.vol + '%';
    revVal.textContent = A.state.rev + '%';
    paintRange(volEl);
    paintRange(revEl);
  }

  volEl.addEventListener('input', function(){
    A.state.vol = Number(volEl.value);
    syncMixUI();
    applyMix();
  });
  revEl.addEventListener('input', function(){
    A.state.rev = Number(revEl.value);
    syncMixUI();
    applyMix();
  });

  octDown.addEventListener('click', function(){ setOctave(oct - 1); });
  octUp.addEventListener('click', function(){ setOctave(oct + 1); });

  /* ========== 初始化 ========== */
  setOctave(0);
  syncMixUI();
  syncButtons();
  updateNoteDisplay();
  requestAnimationFrame(function(){
    fitKeyboard();
    requestAnimationFrame(scrollToMiddleC);
  });
  window.addEventListener('load', fitKeyboard);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitKeyboard);
  }
})();
</script>
</body>
</html>
