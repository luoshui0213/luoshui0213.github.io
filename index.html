    <script>
        /**
         * 黑客风格页面交互脚本
         * 实现命令行打字效果和页面跳转功能
         */

        // 要显示的文本内容
        const hackText = `正在入侵系统...
[████████████████████████████] 100%

访问已被劫持！

Hacked by Luo_Shui洛水！

系统已被完全控制...
所有数据已备份到安全服务器
请选择您的下一步操作：`;

        // 打字速度配置（毫秒）
        const TYPING_SPEED = 50; // 每个字符的打字速度
        const LINE_DELAY = 200; // 每行之间的延迟

        // DOM元素
        let terminalContent;
        let optionsContainer;
        let cursorElement;
        let countdownElement;

        // 当前打字状态
        let currentIndex = 0;
        let isTyping = false;

        // 倒计时相关
        let countdownTimer = null;
        let countdownSeconds = 5;

        /**
         * 初始化函数
         */
        function init() {
            terminalContent = document.getElementById('terminal-content');
            optionsContainer = document.getElementById('options-container');
            cursorElement = document.querySelector('.cursor');
            countdownElement = document.getElementById('countdown');
            
            // 绑定选项点击事件
            document.getElementById('official-site').addEventListener('click', goToOfficialSite);
            document.getElementById('unofficial-site').addEventListener('click', goToUnofficialSite);
            document.getElementById('yzl-site').addEventListener('click', goToYzlSite);
            
            // 开始打字效果
            setTimeout(() => {
                startTyping();
            }, 500);
        }

        /**
         * 打字效果主函数
         */
        function startTyping() {
            if (isTyping) return;
            isTyping = true;
            
            typeText(hackText, 0);
        }

        /**
         * 递归打字函数
         * @param {string} text - 要打印的文本
         * @param {number} index - 当前字符索引
         */
        function typeText(text, index) {
            if (index < text.length) {
                const char = text[index];
                
                // 添加字符到终端
                terminalContent.textContent += char;
                
                // 自动滚动到底部
                terminalContent.parentElement.scrollTop = terminalContent.parentElement.scrollHeight;
                
                // 根据字符类型调整延迟
                let delay = TYPING_SPEED;
                
                // 换行符后增加延迟
                if (char === '\n') {
                    delay = LINE_DELAY;
                }
                
                // 特殊字符（如进度条符号）打得快一些
                if (char === '█' || char === '░' || char === '▓' || char === '▒') {
                    delay = 20;
                }
                
                // 继续打下一个字符
                setTimeout(() => {
                    typeText(text, index + 1);
                }, delay);
            } else {
                // 打字完成，显示选项
                isTyping = false;
                showOptions();
            }
        }

        /**
         * 显示选项菜单
         */
        function showOptions() {
            // 隐藏光标
            cursorElement.style.display = 'none';
            
            // 短暂延迟后显示选项
            setTimeout(() => {
                optionsContainer.classList.remove('hidden');
                
                // 添加选项出现的音效提示（可选）
                playBeep();
                
                // 启动倒计时
                startCountdown();
            }, 500);
        }

        /**
        * 个人主页*/
        function goToOfficialSite() {
        // 清除倒计时
        stopCountdown();
    
        showTransition('正在进入网站...',() => {
            // 跳转到同目录下的 home.html
            window.location.href = 'home.html';
            });
        }

        /**
         * 前往Vsinger官网
         */
        function goToYzlSite() {
            stopCountdown();
            showTransition('正在跳转到Vsinger官网...', () => {
                window.location.href = 'https://vsinger.com';
            });
        }

        /**
         * 前往哔哩哔哩网页版（首页）
         */
        function goToUnofficialSite() {
            // 清除倒计时
            if (countdownTimer) {
                clearInterval(countdownTimer);
            }
            
            showTransition('正在前往哔哩哔哩网页版...', () => {
                window.location.href = 'https://bilibili.com';
            });
        }

        /**
         * 启动倒计时
         */
        function startCountdown() {
            let seconds = countdownSeconds;
            
            // 更新倒计时显示
            function updateCountdown() {
                countdownElement.textContent = `(${seconds}秒后自动跳转)`;
                countdownElement.style.color = '#00ff00';
                countdownElement.style.fontWeight = 'bold';
                
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    // 自动跳转到哔哩哔哩网页版
                    goToUnofficialSite();
                }
                
                seconds--;
            }
            
            // 立即显示初始倒计时
            updateCountdown();
            
            // 每秒更新一次
            countdownTimer = setInterval(updateCountdown, 1000);
        }

        /**
         * 停止倒计时
         */
        function stopCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
        }

        /**
         * 显示跳转过渡效果
         * @param {string} message - 跳转提示信息
         * @param {Function} callback - 跳转回调函数
         */
        function showTransition(message, callback) {
            // 隐藏选项
            optionsContainer.style.opacity = '0';
            
            // 显示跳转信息
            setTimeout(() => {
                terminalContent.textContent += '\n\n' + message;
                terminalContent.parentElement.scrollTop = terminalContent.parentElement.scrollHeight;
                
                // 显示光标闪烁
                cursorElement.style.display = 'inline-block';
                
                // 延迟跳转
                setTimeout(callback, 1500);
            }, 300);
        }

        /**
         * 播放提示音效（简单的实现）
         */
        function playBeep() {
            // 使用Web Audio API创建简单的提示音
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                // 如果音频API不可用，静默失败
                console.log('Audio API not available');
            }
        }

        /**
         * 键盘快捷键支持
         */
        document.addEventListener('keydown', (e) => {
            if (!isTyping && !optionsContainer.classList.contains('hidden')) {
                if (e.key === '1') {
                    stopCountdown();
                    goToOfficialSite();
                } else if (e.key === '2') {
                    stopCountdown();
                    goToUnofficialSite();
                }
            }
        });

        /**
         * 防止页面刷新时的确认
         */
        window.addEventListener('beforeunload', (e) => {
            if (isTyping) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
