<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卢高得不自</title>
    <style>
        /* 基础页面样式：纯黑背景，黑客绿文字 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; /* 等宽字体*/
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 终端外框 */
        .terminal {
            width: 90%;
            max-width: 500px;
            border: 2px solid #00ff00;
            background-color: #0a0a0a;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); /* 绿色发光效果 */
            padding: 20px;
            box-sizing: border-box;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        /* 顶部系统提示 */
        .header {
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* 文字输出区域 */
        .content {
            flex-grow: 1;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap; 
        }

        /* 进度条外框 */
        .progress-bar-container {
            width: 100%;
            height: 20px;
            border: 1px solid #00ff00;
            margin: 10px 0;
            display: none;
        }

        /* 进度条实体 */
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00ff00;
            transition: width 0.1s linear;
        }

        /* 底部按钮区域 */
        .options {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        /* 按钮样式 */
        .option-btn {
            background-color: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            line-height: 1.4;
        }

        /* 按钮按下或悬浮的效果 */
        .option-btn:hover, .option-btn:active {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }

        /* 闪烁光标 */
        .cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ======= 新增的切换导航样式 ======= */
        .nav-bar {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .nav-btn:hover, .nav-btn:active {
                    background-color: #fff;
            color: #000;
        }
        .content-block {
            width: 90%;
            max-width: 600px;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">root@system:~#</div>
    <div class="content" id="text-output"></div>

    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="options" id="options">
        <button class="option-btn" onclick="enterSite()">[ 1 ] 进入我的娱乐网站</button>
        <button class="option-btn" id="auto-jump-btn">[ 2 ] 自动前往哔哩哔哩网页版 (5秒后自动跳转)</button>
        <button class="option-btn" onclick="window.location.href='https://github.com'">[ 3 ] 前往GitHub网页端 (github.com)</button>
    </div>
</div>

<div id="main-site" style="display: none; width: 100%; height: 100vh; text-align: center; color: #fff; background-color: #000; flex-direction: column; justify-content: center; align-items: center;">
    <!-- 顶部导航栏（切换按钮） -->
<div class="nav-bar">
    <button class="nav-btn" onclick="switchTab('page-home')">首页</button>
    <button class="nav-btn" onclick="switchTab('page-resources')">资源下载</button>
    <button class="nav-btn" onclick="switchTab('page-about')">关于我</button>
</div>

<!-- 内容区 1：首页（默认显示） -->
<div id="page-home" class="content-block" style="display: block;">
    <h1>欢迎来到洛水的个人网站！</h1>
    <p>作者B站个人空间，添加请点击<a href="https://space.bilibili.com/3707020247042077" style="color:#66ccff; text-decoration:underline;"><i>这里</i></a></p>
    <p>注：动画灵感来自Vsinger的官网<a href="https://thstars.com" style="color:#66ccff; text-decoration:underline;">https://thstars.com</a></p>
    <p>暂无其他内容，如有建议请联系作者。</p>
    <p>作者邮箱：<a href="mailto:luoshui0213@163.com?subject=建议" style="color:#66ccff; text-decoration:underline;">luoshui0213@163.com</a></p>
    <p>本网站由卢高第15技术部提供支持</p
</div>

<!-- 内容区 2：资源下载（默认隐藏） -->
<div id="page-resources" class="content-block" style="display: none;">
    <h1>资源下载中心</h1>
    <p>这里以后放你的文件链接。</p>
</div>

<!-- 内容区 3：关于我（默认隐藏） -->
<div id="page-about" class="content-block" style="display: none;">
    <h1>关于我</h1>
    <p>这里是你的个人介绍。</p>
</div>

<script>
    const textOutput = document.getElementById('text-output');
    const options = document.getElementById('options');
    const autoJumpBtn = document.getElementById('auto-jump-btn');

    let timer; // 将定时器提出来，方便随时取消

    // 逐字打印效果
    function typeText(text) {
        return new Promise(resolve => {
            let i = 0;
            function type() {
                if (i < text.length) {
                    textOutput.innerHTML = textOutput.innerHTML.replace('<span class="cursor">|</span>', '');
                    textOutput.innerHTML += text.charAt(i) + '<span class="cursor">|</span>';
                    i++;
                    setTimeout(type, 50); // 50毫秒打一个字
                } else {
                    resolve();
                }
            }
            type();
        });
    }

    // 纯文本动态进度条
    function drawProgressBar() {
        return new Promise(resolve => {
            let percentage = 0;
            const barLength = 15; // 进度条的长度（方块数量）

            function updateBar() {
                textOutput.innerHTML = textOutput.innerHTML.replace('<span class="cursor">|</span>', '');

                // 计算填充和空白
                let filled = Math.floor((percentage / 100) * barLength);
                let empty = barLength - filled;
                let barStr = "[" + "█".repeat(filled) + " ".repeat(empty) + "] " + percentage + "%";

                // 替换最后一行进度条
                let lines = textOutput.innerHTML.split('\n');
                if (lines[lines.length - 1].startsWith("[")) {
                     lines[lines.length - 1] = barStr;
                     textOutput.innerHTML = lines.join('\n');
                } else {
                     textOutput.innerHTML += barStr;
                }

                if (percentage < 100) {
                    percentage += 5;
                    textOutput.innerHTML += '<span class="cursor">|</span>';
                    setTimeout(updateBar, 40); // 进度条速度
                } else {
                    resolve();
                }
            }
            updateBar();
        });
    }

    // 倒计时跳转逻辑
    function startCountdown() {
        let timeLeft = 5; 
        autoJumpBtn.innerText = `[ 2 ] 自动前往哔哩哔哩网页版 (${timeLeft}秒后自动跳转)`;

        timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                autoJumpBtn.innerText = `[ 2 ] 自动前往哔哩哔哩网页版 (${timeLeft}秒后自动跳转)`;
            } else {
                clearInterval(timer);
                // 倒计时结束，跳转到B站
                window.location.href = 'https://www.bilibili.com'; 
            }
        }, 1000);
    }

    // 核心：进入主页的函数
    function enterSite() {
        
        clearInterval(timer); 

        const terminal = document.querySelector('.terminal');
        const mainSite = document.getElementById('main-site');

        // 1. 黑框渐渐消失
        terminal.style.transition = 'opacity 0.5s ease';
        terminal.style.opacity = '0';

        // 2. 0.5秒后，彻底隐藏黑框，并显示主页
        setTimeout(() => {
            terminal.style.display = 'none';
            
            mainSite.style.display = 'flex'; 
            // 主页淡入效果
            mainSite.style.opacity = '0';
            mainSite.style.transition = 'opacity 1s ease';
            setTimeout(() => { mainSite.style.opacity = '1'; }, 50);
        }, 500);
    }

    // 执行主流程
    async function playAnimation() {
        await typeText("正在入侵系统...\n");
        await drawProgressBar(); 
        await typeText("\n访问已被劫持！\n\n");
        await typeText("Hacked by Luo_Shui洛水！\n\n");
        await typeText("系统已被完全控制...\n");
        await typeText("所有数据已备份到安全服务器\n");
        await typeText("请选择您的下一步操作：\n");

        options.style.display = 'flex';
        startCountdown();
    }

    // 网页加载后开始执行
    window.onload = () => {
        setTimeout(playAnimation, 500);
    };
    // ======= 新增的切换区块函数 =======
    function switchTab(tabId) {
        // 1. 先把所有的内容区块找出来，全部隐藏
        const blocks =  document.querySelectorAll('.content-block');
        blocks.forEach(block => {
            block.style.display = 'none';
        });

        // 2. 把你想看的那个区块显示出来
        const targetBlock = document.getElementById(tabId);
        if (targetBlock) {
            targetBlock.style.display = 'block';
        }
    }
</script>

</body>
</html>
