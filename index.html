                scrollToEnd();

                let delay = TYPE_SPEED;
                if (ch === '\n') delay = LINE_DELAY;
                if (ch === '█' || ch === '░' || ch === '▓' || ch === '▒') delay = BAR_DELAY;

                setTimeout(typeNext, delay);
            }

            /* 点击 / 回车可跳过打字 */
            function skipTyping() {
                if (!typing) return;
                typing = false;
                index = hackText.length;
                el.content.textContent = hackText;
                el.caret.classList.add('done');
                scrollToEnd();
                showOptions();
            }

            function finishTyping() {
                typing = false;
                el.caret.classList.add('done');
                setTimeout(showOptions, reduce ? 0 : 320);
            }

            function showOptions() {
                el.options.hidden = false;
                scrollToEnd();
                setTimeout(scrollToEnd, 120);
                beep();
                startCountdown();
            }

            /**
             * 直接进入“已解锁”终态：全文 + 选项可点
             * 返回本站时使用，不重新打字、不重新倒计时
             */
            function showFinalState(opts) {
                const o = opts || {};
                typing = false;
                navigating = false;
                index = hackText.length;
                stopCountdown();

                el.content.textContent = hackText;
                el.caret.classList.add('done');
                el.options.hidden = false;

                if (o.withCountdown) {
                    startCountdown();
                } else {
                    el.countdown.textContent = '';
                }

                scrollToEnd();
                setTimeout(scrollToEnd, 120);
                if (o.beep) beep();
            }

            el.scroller.addEventListener('click', skipTyping);
            el.scroller.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    skipTyping();
                }
            });

            /* ---------- 跳转 ---------- */
            function goToOfficialSite() {
                transition('正在进入网站...', 'home.html');
            }

            function goToUnofficialSite() {
                transition('正在前往SCP维基...', 'https://scp-wiki-cn.wikidot.com');
            }

            function goToYzlSite() {
                transition('正在跳转到Vsinger官网...', 'https://vsinger.com');
            }

            /* ---------- 倒计时（切到后台自动暂停） ---------- */
            let cdLeft = COUNTDOWN_SECONDS;
            let cdTimer = null;
            let cdActive = false;

            function startCountdown() {
                cdLeft = COUNTDOWN_SECONDS;
                cdActive = true;
                renderCountdown(cdLeft);
                clearInterval(cdTimer);
                cdTimer = setInterval(stepCountdown, 1000);
            }

            function stepCountdown() {
                cdLeft--;
                if (cdLeft <= 0) {
                    stopCountdown();
                    renderCountdown(0);
                    goToUnofficialSite();
                    return;
                }
                renderCountdown(cdLeft);
            }

            function renderCountdown(s) {
                el.countdown.textContent = '(' + s + '秒后自动跳转)';
            }

            function stopCountdown() {
                cdActive = false;
                clearInterval(cdTimer);
                cdTimer = null;
            }

            document.addEventListener('visibilitychange', function () {
                if (!cdActive) return;
                if (document.hidden) {
                    clearInterval(cdTimer);
                    cdTimer = null;
                } else if (!cdTimer) {
                    cdTimer = setInterval(stepCountdown, 1000);
                }
            });

            /* ---------- 过渡提示 ---------- */
            /**
             * 选项保持可见可点：即使浏览器/内嵌容器拦截了跳转，
             * 也不会留下一个“按钮消失、点不动”的死页面。
             */
            function transition(message, href) {
                if (navigating) return;
                navigating = true;
                stopCountdown();
                markReturned(); /* 记下“已离开过”，回来时不再倒数 */

                el.content.textContent = hackText + '\n\n' + message;
                el.caret.classList.remove('done');
                scrollToEnd();

                setTimeout(function () {
                    try {
                        window.location.href = href;
                    } catch (err) {
                        /* 被拦截则保持可点 */
                    }
                }, reduce ? 0 : 1400);

                // 保底：4 秒后仍停留在本页，说明跳转未成功，恢复可再次点击
                setTimeout(function () {
                    navigating = false;
                    el.caret.classList.add('done');
                }, 4000);
            }

            /* ---------- 提示音 ---------- */
            function beep() {
                try {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return;
                    audioCtx = audioCtx || new Ctx();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const t = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, t);
                    osc.frequency.exponentialRampToValueAtTime(1320, t + 0.06);
                    gain.gain.setValueAtTime(0.0001, t);
                    gain.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.14);
                } catch (e) {
                    /* 音频不可用时静默 */
                }
            }

            /* ---------- 事件 ---------- */
            document.getElementById('official-site').addEventListener('click', goToOfficialSite);
            document.getElementById('unofficial-site').addEventListener('click', goToUnofficialSite);
            document.getElementById('yzl-site').addEventListener('click', goToYzlSite);

            document.addEventListener('keydown', function (e) {
                if (typing) {
                    if (e.key === 'Enter' || e.key === ' ') skipTyping();
                    return;
                }
                if (el.options.hidden || navigating) return;
                if (e.key === '1') { e.preventDefault(); goToOfficialSite(); }
                else if (e.key === '2') { e.preventDefault(); goToUnofficialSite(); }
                else if (e.key === '3') { e.preventDefault(); goToYzlSite(); }
            });

            // 浏览器前进/后退命中页面缓存时：恢复成可点击状态，不再倒数
            window.addEventListener('pageshow', function (e) {
                if (!e.persisted) return; /* 首次加载走正常流程 */
                markReturned();
                showFinalState({});
            });

            // 启动：首次访问才播打字与倒计时；返回本站直接给终态
            if (hasReturned()) {
                showFinalState({});
            } else {
                setTimeout(typeNext, reduce ? 0 : 420);
            }
        })();
    </script>
