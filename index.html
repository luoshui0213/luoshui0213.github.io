<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统访问提示</title>
    <style>
        /* 基础页面样式：纯黑背景，黑客绿文字 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; /* 等宽字体*/
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 终端外框 */
        .terminal {
            width: 90%;
            max-width: 500px;
            border: 2px solid #00ff00;
            background-color: #0a0a0a;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); /* 绿色发光效果 */
            padding: 20px;
            box-sizing: border-box;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        /* 顶部系统提示 */
        .header {
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* 文字输出区域 */
        .content {
            flex-grow: 1;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap; 
        }

        /* 进度条外框 */
        .progress-bar-container {
            width: 100%;
            height: 20px;
            border: 1px solid #00ff00;
            margin: 10px 0;
            display: none;
        }

        /* 进度条实体 */
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00ff00;
            transition: width 0.1s linear;
        }

        /* 底部按钮区域 */
        .options {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        /* 按钮样式 */
        .option-btn {
            background-color: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            line-height: 1.4;
        }

        /* 按钮按下或悬浮的效果 */
        .option-btn:hover, .option-btn:active {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }
        
        /* 闪烁光标 */
        .cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">root@system:~#</div>
    <div class="content" id="text-output"></div>
    
    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="options" id="options">
        <!-- 在这里修改你的跳转链接和文字 -->
        <button class="option-btn" onclick="window.location.href='https://luoshui0213.github.io'">[ 1 ] 前往我的娱乐网站 (luoshui0213.github.io)</button>
        <button class="option-btn" id="auto-jump-btn">[ 2 ] 自动前往哔哩哔哩网页版 (5秒后自动跳转)</button>
        <button class="option-btn" onclick="window.location.href='https://github.com'">[ 3 ] 前往GitHub网页端 (github.com)</button>
    </div>
</div>

<script>
    const textOutput = document.getElementById('text-output');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const options = document.getElementById('options');
    const autoJumpBtn = document.getElementById('auto-jump-btn');

    // 你想要显示的文字，按顺序
    const messages = [
        "正在入侵系统...\n",
        "[PROGRESS]", // 进度条占位
        "\n访问已被劫持！\n\n",
        "Hacked by 微羽摩柯！\n\n",
        "系统已被完全控制...\n",
        "所有数据已备份到安全服务器\n",
        "请选择您的下一步操作：\n"
    ];

    let currentMessageIndex = 0;
    let charIndex = 0;

    // 打字机效果核心代码
    function typeWriter() {
        if (currentMessageIndex < messages.length) {
            const msg = messages[currentMessageIndex];
            
            // 遇到进度条标记
            if (msg === "[PROGRESS]") {
                progressContainer.style.display = 'block';
                let width = 0;
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        currentMessageIndex++;
                        typeWriter(); 
                    } else {
                        width++;
                        progressBar.style.width = width + '%';
                    }
                }, 20);
                return;
            }

            // 逐个字符打印
            if (charIndex < msg.length) {
                textOutput.innerHTML = textOutput.innerHTML.replace('<span class="cursor">|</span>', '');
                textOutput.innerHTML = textOutput.innerHTML.replace('<span class="cursor">|</span>', '');
                textOutput.innerHTML += msg.charAt(charIndex) + '<span class="cursor">|</span>';
                charIndex++;
                setTimeout(typeWriter, 60); // 60毫秒打一个字，可以自己改
            } else {
                currentMessageIndex++;
                charIndex = 0;
                setTimeout(typeWriter, 300);
            }
        } else {
            // 全部打完，显示按钮
            textOutput.innerHTML = textOutput.innerHTML.replace('<span class="cursor">|</span>', '');
            options.style.display = 'flex';
            startCountdown();
        }
    }

    // 倒计时跳转逻辑 (对应你的图2)
    function startCountdown() {
        let timeLeft = 5;
        autoJumpBtn.innerText = `[ 2 ] 自动前往哔哩哔哩网页版 (${timeLeft}秒后自动跳转)`;
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                autoJumpBtn.innerText = `[ 2 ] 自动前往哔哩哔哩网页版 (${timeLeft}秒后自动跳转)`;
            } else {
                clearInterval(timer);
                window.location.href = 'https://www.bilibili.com'; 
            }
        }, 1000);
    }

    // 网页加载后开始执行
    window.onload = () => {
        setTimeout(typeWriter, 500);
    };
</script>

</body>
</html>
